# Code generation image: buf and the four plugins that turn the .proto into a
# gRPC server, a REST gateway and an OpenAPI document.
#
# Separate from the test image on purpose. Generation runs when the contract
# changes; tests run constantly, and carrying these tools in that image would
# slow every run for no benefit.
#
# ADR-0003 makes api/proto/wgagent/v1 the source of truth, and REQ-API-061 has
# CI block a compatibility-breaking change within a package version. Both need
# the same pinned toolchain, so the versions here are exact rather than latest.
FROM golang:1.23-alpine

RUN apk add --no-cache curl git

ARG BUF_VERSION=1.47.2
RUN curl -sSL \
      "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
      -o /usr/local/bin/buf \
 && chmod +x /usr/local/bin/buf

RUN go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2 \
 && go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1 \
 && go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.24.0 \
 && go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.24.0

ENV PATH=/root/go/bin:$PATH
ENV GOCACHE=/tmp/gocache
ENV GOMODCACHE=/tmp/gomodcache

WORKDIR /src
