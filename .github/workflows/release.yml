name: release

# Build the NativeAOT .deb and publish it with its checksum on a version tag — REQ-CFG-051.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install the NativeAOT toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publish the binary (NativeAOT, linux-x64)
        run: dotnet publish src/WgAgent.Cli -c Release -r linux-x64 -p:Version=${{ steps.version.outputs.value }} -o publish
      - name: Build the .deb
        id: deb
        run: echo "path=$(packaging/build-deb.sh publish/wg-agent ${{ steps.version.outputs.value }} artifacts)" >> "$GITHUB_OUTPUT"
      - name: Checksum
        run: cd artifacts && sha256sum "$(basename '${{ steps.deb.outputs.path }}')" > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.deb artifacts/SHA256SUMS
             --repo "${GITHUB_REPOSITORY}" --title "wg-agent ${GITHUB_REF_NAME}" --generate-notes
