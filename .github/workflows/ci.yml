name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Documentation integrity, REQ-ID traceability and diagram rendering. No
  # toolchain beyond Docker, so this gate holds while the specification is ahead
  # of the code.
  #
  # Each further job arrives with the tooling it runs. A job that calls a target
  # nothing defines fails on every push and teaches the reader to ignore red.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation checks
        run: docs/check-docs.sh
      - name: REQ-ID traceability
        run: docs/check-traceability.sh
      - name: Diagrams render
        run: docs/check-mermaid.sh

  # Build with warnings as errors, then the unit tier: no privilege needed.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: make build
      - name: Unit tests
        run: make test
