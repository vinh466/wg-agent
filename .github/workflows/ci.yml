name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Documentation integrity, REQ-ID traceability and diagram rendering. No
  # toolchain beyond Docker, so this gate holds while the specification is ahead
  # of the code.
  #
  # The build, test and contract jobs arrive with the tooling they run, as the
  # implementation is rebuilt from the specification. A job that calls a target
  # nothing defines fails on every push and teaches the reader to ignore red.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation checks
        run: docs/check-docs.sh
      - name: REQ-ID traceability
        run: docs/check-traceability.sh
      - name: Diagrams render
        run: docs/check-mermaid.sh
