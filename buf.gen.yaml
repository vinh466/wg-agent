version: v2
managed:
  enabled: false
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: gen/go
    opt: paths=source_relative
  # grpc-gateway generates OpenAPI v2. The project has no v3 generator, so the
  # contract this publishes is v2, and docs/30-api/README.md says so rather
  # than claiming otherwise.
  - local: protoc-gen-openapiv2
    out: docs/30-api
    opt:
      - allow_merge=true
      - merge_file_name=openapi
      - output_format=yaml
      - openapi_naming_strategy=simple
