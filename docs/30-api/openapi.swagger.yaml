swagger: "2.0"
info:
  title: wgagent/v1/resources.proto
  version: version not set
tags:
  - name: InterfaceService
  - name: PeerService
  - name: RuntimeService
  - name: ConfigService
  - name: DiagnosticsService
  - name: SystemService
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/health:
    get:
      operationId: SystemService_GetHealth
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/GetHealthResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      tags:
        - SystemService
  /v1/interfaces:
    get:
      operationId: InterfaceService_ListInterfaces
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/ListInterfacesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: pageSize
          in: query
          required: false
          type: integer
          format: int64
        - name: pageToken
          in: query
          required: false
          type: string
      tags:
        - InterfaceService
    post:
      operationId: InterfaceService_CreateInterface
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/Interface'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateInterfaceRequest'
      tags:
        - InterfaceService
  /v1/interfaces/{interfaceName}/peers:
    get:
      operationId: PeerService_ListPeers
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/ListPeersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: interfaceName
          in: path
          required: true
          type: string
        - name: pageSize
          in: query
          required: false
          type: integer
          format: int64
        - name: pageToken
          in: query
          required: false
          type: string
      tags:
        - PeerService
    post:
      operationId: PeerService_CreatePeer
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/Peer'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: interfaceName
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreatePeerBody'
      tags:
        - PeerService
  /v1/interfaces/{interfaceName}/peers/{publicKey}:
    get:
      operationId: PeerService_GetPeer
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/Peer'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: interfaceName
          in: path
          required: true
          type: string
        - name: publicKey
          in: path
          required: true
          type: string
      tags:
        - PeerService
    delete:
      operationId: PeerService_DeletePeer
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: interfaceName
          in: path
          required: true
          type: string
        - name: publicKey
          in: path
          required: true
          type: string
        - name: revision
          in: query
          required: false
          type: string
      tags:
        - PeerService
    put:
      operationId: PeerService_UpdatePeer
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/Peer'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: interfaceName
          in: path
          required: true
          type: string
        - name: publicKey
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdatePeerBody'
      tags:
        - PeerService
  /v1/interfaces/{interfaceName}/peers/{publicKey}:generateConfig:
    post:
      operationId: ConfigService_GenerateClientConfig
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/GenerateClientConfigResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: interfaceName
          in: path
          required: true
          type: string
        - name: publicKey
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/GenerateClientConfigBody'
      tags:
        - ConfigService
  /v1/interfaces/{interfaceName}/peers:batchUpdate:
    post:
      operationId: PeerService_BatchUpdatePeers
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/BatchUpdatePeersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: interfaceName
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/BatchUpdatePeersBody'
      tags:
        - PeerService
  /v1/interfaces/{interfaceName}/peers:status:
    get:
      operationId: RuntimeService_ListPeerStatus
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/ListPeerStatusResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: interfaceName
          in: path
          required: true
          type: string
        - name: pageSize
          in: query
          required: false
          type: integer
          format: int64
        - name: pageToken
          in: query
          required: false
          type: string
      tags:
        - RuntimeService
  /v1/interfaces/{name}:
    get:
      operationId: InterfaceService_GetInterface
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/Interface'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: name
          in: path
          required: true
          type: string
      tags:
        - InterfaceService
    delete:
      operationId: InterfaceService_DeleteInterface
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: name
          in: path
          required: true
          type: string
        - name: revision
          in: query
          required: false
          type: string
      tags:
        - InterfaceService
    put:
      operationId: InterfaceService_UpdateInterface
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/Interface'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: name
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdateInterfaceBody'
      tags:
        - InterfaceService
  /v1/interfaces/{name}/status:
    get:
      operationId: RuntimeService_GetInterfaceStatus
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/InterfaceStatus'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: name
          in: path
          required: true
          type: string
      tags:
        - RuntimeService
  /v1/interfaces/{name}:adopt:
    post:
      operationId: InterfaceService_AdoptInterface
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/AdoptInterfaceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: name
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AdoptInterfaceBody'
      tags:
        - InterfaceService
  /v1/interfaces/{name}:diagnose:
    get:
      operationId: DiagnosticsService_DiagnoseInterface
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/DiagnoseInterfaceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: name
          in: path
          required: true
          type: string
      tags:
        - DiagnosticsService
  /v1/interfaces/{name}:release:
    post:
      operationId: InterfaceService_ReleaseInterface
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/ReleaseInterfaceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: name
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ReleaseInterfaceBody'
      tags:
        - InterfaceService
  /v1/interfaces/{name}:rotateKey:
    post:
      operationId: InterfaceService_RotateInterfaceKey
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/RotateInterfaceKeyResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: name
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/RotateInterfaceKeyBody'
      tags:
        - InterfaceService
  /v1/keys:generate:
    post:
      operationId: ConfigService_GenerateKeyPair
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/GenerateKeyPairResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/GenerateKeyPairRequest'
      tags:
        - ConfigService
  /v1/overview:
    get:
      operationId: DiagnosticsService_GetOverview
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/GetOverviewResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      tags:
        - DiagnosticsService
  /v1/reconcile:
    post:
      operationId: SystemService_Reconcile
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/ReconcileResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
        - name: body
          description: |-
            REQ-RCN-020: an explicit Reconcile takes its scope from the request body, so
            one collection-level path covers the whole node and a single interface.
          in: body
          required: true
          schema:
            $ref: '#/definitions/ReconcileRequest'
      tags:
        - SystemService
  /v1/version:
    get:
      operationId: SystemService_GetVersion
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/GetVersionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      tags:
        - SystemService
definitions:
  AdoptInterfaceBody:
    type: object
    properties:
      forwardPolicy:
        $ref: '#/definitions/ForwardPolicySpec'
      nat:
        $ref: '#/definitions/NatSpec'
      manageRoutes:
        type: boolean
      validateOnly:
        type: boolean
    description: |-
      AdoptInterfaceRequest is REQ-RCN-066. The three policy fields use explicit
      presence because the requirement rejects a request that omits any of them
      with ADOPTION_FIELD_REQUIRED: the kernel holds no forward policy and no
      routing intent, so a default would be a guess applied to a live node.

      validate_only is REQ-API-068 — return the spec the request would store
      without writing it.
  AdoptInterfaceResponse:
    type: object
    properties:
      interface:
        $ref: '#/definitions/Interface'
      peers:
        type: array
        items:
          type: object
          $ref: '#/definitions/Peer'
      findings:
        type: array
        items:
          type: object
          $ref: '#/definitions/CheckResult'
      validateOnly:
        type: boolean
    description: |-
      Write-only fields are excluded from spec here under REQ-DIA-047 and
      REQ-RES-013: the response states that a key is present, never its value.
  Any:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  Axis:
    type: string
    enum:
      - AXIS_UNSPECIFIED
      - AXIS_ALLOW
      - AXIS_DENY
      - AXIS_ALLOW_LIST
    default: AXIS_UNSPECIFIED
    description: |-
      Axis is a forward-policy axis value. SPEC-02 section 2 fixes the set;
      AXIS_ALLOW_LIST applies to inter_interface alone, per REQ-FWD-002.
  BatchUpdatePeersBody:
    type: object
    properties:
      peers:
        type: array
        items:
          type: object
          $ref: '#/definitions/Peer'
      replaceAll:
        type: boolean
      interfaceRevision:
        type: string
    description: |-
      interface_revision is REQ-API-072. It is the interface's revision rather than
      each peer's, because replace_all deletes every peer the request omits, and
      REQ-API-077 makes that revision move when the peer set changes.
  BatchUpdatePeersResponse:
    type: object
    properties:
      peers:
        type: array
        items:
          type: object
          $ref: '#/definitions/Peer'
  CheckResult:
    type: object
    properties:
      name:
        type: string
      result:
        $ref: '#/definitions/Result'
      observed:
        type: array
        items:
          type: string
      expected:
        type: array
        items:
          type: string
      hintCode:
        type: string
      hint:
        type: string
    description: |-
      CheckResult is REQ-DIA-002. observed and expected are lists because
      REQ-DIA-031 requires a peer-scoped check to name every public key concerned,
      and a single string would need a separator no requirement defines.

      REQ-DIA-041 reuses this shape for a readiness finding rather than defining a
      second one, and REQ-DIA-051 fixes the closed set hint_code is drawn from.
  ClientRouting:
    type: string
    enum:
      - CLIENT_ROUTING_UNSPECIFIED
      - CLIENT_ROUTING_AUTO
      - CLIENT_ROUTING_FULL_TUNNEL
      - CLIENT_ROUTING_CUSTOM
    default: CLIENT_ROUTING_UNSPECIFIED
    description: ClientRouting is REQ-KEY-030.
  Condition:
    type: object
    properties:
      state:
        $ref: '#/definitions/ConditionState'
      reason:
        type: string
      message:
        type: string
    description: |-
      Condition is REQ-RES-032. reason is drawn from the closed set of
      REQ-API-041; a READY condition carries none.
  ConditionState:
    type: string
    enum:
      - CONDITION_STATE_UNSPECIFIED
      - CONDITION_STATE_READY
      - CONDITION_STATE_PROGRESSING
      - CONDITION_STATE_DEGRADED
    default: CONDITION_STATE_UNSPECIFIED
    description: |-
      ConditionState is the lifecycle state of REQ-RES-032. The three values are
      mutually exclusive, which is why this is one field rather than a list.
  CreateInterfaceRequest:
    type: object
    properties:
      name:
        type: string
      spec:
        $ref: '#/definitions/InterfaceSpec'
  CreatePeerBody:
    type: object
    properties:
      publicKey:
        type: string
      spec:
        $ref: '#/definitions/PeerSpec'
  DiagnoseInterfaceResponse:
    type: object
    properties:
      checks:
        type: array
        items:
          type: object
          $ref: '#/definitions/CheckResult'
  ForwardPolicySpec:
    type: object
    properties:
      intraInterface:
        $ref: '#/definitions/Axis'
      interInterface:
        $ref: '#/definitions/Axis'
      allowedPeerInterfaces:
        type: array
        items:
          type: string
      external:
        $ref: '#/definitions/Axis'
    description: ForwardPolicySpec is SPEC-02 section 2.
  GenerateClientConfigBody:
    type: object
    properties:
      routing:
        $ref: '#/definitions/ClientRouting'
      extraAllowedIps:
        type: array
        items:
          type: string
      dns:
        type: array
        items:
          type: string
      endpoint:
        type: string
      includeQr:
        type: boolean
    description: |-
      endpoint is REQ-KEY-037: taken from the request, or from the node.endpoint
      configuration key when omitted. REQ-KEY-038 refuses the request when neither
      supplies one, because a .conf without an Endpoint reaches nothing.
  GenerateClientConfigResponse:
    type: object
    properties:
      config:
        type: string
      derivedAllowedIps:
        type: array
        items:
          type: string
      routingExplanation:
        type: string
      qr:
        type: string
    description: qr is REQ-KEY-039, present when the request asked for one.
  GenerateKeyPairRequest:
    type: object
  GenerateKeyPairResponse:
    type: object
    properties:
      privateKey:
        type: string
      publicKey:
        type: string
    description: |-
      REQ-KEY-040. REQ-KEY-041 puts this response under REQ-KEY-012 and
      REQ-KEY-013: the private key is returned once and never stored, and no API
      returns an already generated one.
  GetHealthResponse:
    type: object
    properties:
      serving:
        type: boolean
    description: |-
      REQ-API-051: success only after every startup check passes and the first
      reconcile pass completes.
  GetOverviewResponse:
    type: object
    properties:
      components:
        type: array
        items:
          type: object
          $ref: '#/definitions/OverviewComponent'
  GetVersionResponse:
    type: object
    properties:
      version:
        type: string
      commit:
        type: string
      goVersion:
        type: string
      startTime:
        type: string
        format: date-time
      uptimeSeconds:
        type: string
        format: uint64
    description: REQ-API-078 — the same five values the agent row of REQ-DIA-020 reports.
  Interface:
    type: object
    properties:
      name:
        type: string
      spec:
        $ref: '#/definitions/InterfaceSpec'
      status:
        $ref: '#/definitions/InterfaceStatus'
    description: |-
      Interface is the resource. REQ-RES-034 puts identity here rather than in
      spec, so that a FOREIGN interface — returned with status populated and spec
      absent under REQ-RCN-031 — is still addressable.
  InterfaceSpec:
    type: object
    properties:
      privateKey:
        type: string
        description: Write-only. REQ-RES-013 keeps it out of every response.
      listenPort:
        type: integer
        format: int64
      addresses:
        type: array
        items:
          type: string
      mtu:
        type: integer
        format: int64
      fwmark:
        type: integer
        format: int64
      manageRoutes:
        type: boolean
      forwardPolicy:
        $ref: '#/definitions/ForwardPolicySpec'
      nat:
        $ref: '#/definitions/NatSpec'
      enabled:
        type: boolean
      labels:
        type: object
        additionalProperties:
          type: string
    description: |-
      InterfaceSpec is SPEC-01 section 3.2.

      It carries no name: REQ-RES-034 keeps identity outside spec and status.

      mtu, manage_routes and enabled use explicit presence under REQ-API-076,
      because their defaults are not their zero values. Without it a caller that
      omits enabled would take the link down, and one that omits manage_routes
      would drop its routes — REQ-API-064 replaces the whole spec.

      listen_port, fwmark and persistent_keepalive need no presence marker: their
      zero value carries meaning and is also their default, which is the
      distinction SPEC-04 section 5.1 draws.
  InterfaceStatus:
    type: object
    properties:
      publicKey:
        type: string
      listenPort:
        type: integer
        format: int64
      instanceId:
        type: string
      createdAt:
        type: string
        format: date-time
      revision:
        type: string
        description: 'Opaque under REQ-RES-031: compared and returned, never parsed.'
      operState:
        $ref: '#/definitions/OperState'
      ownership:
        $ref: '#/definitions/Ownership'
      peerCount:
        type: integer
        format: int64
      condition:
        $ref: '#/definitions/Condition'
      warnings:
        type: array
        items:
          type: object
          $ref: '#/definitions/Warning'
      masqueradeOutInterface:
        type: string
        description: The uplink derived under REQ-FWD-031, empty when NAT is off.
      lastReconcileAt:
        type: string
        format: date-time
    description: InterfaceStatus is SPEC-01 section 3.3. A caller never writes it.
  ListInterfacesResponse:
    type: object
    properties:
      interfaces:
        type: array
        items:
          type: object
          $ref: '#/definitions/Interface'
      nextPageToken:
        type: string
  ListPeerStatusResponse:
    type: object
    properties:
      peers:
        type: array
        items:
          type: object
          $ref: '#/definitions/Peer'
      nextPageToken:
        type: string
    description: |-
      Peer rather than PeerStatus: REQ-RES-034 keeps identity outside status, so a
      bare status carries nothing to say which peer it belongs to.
  ListPeersResponse:
    type: object
    properties:
      peers:
        type: array
        items:
          type: object
          $ref: '#/definitions/Peer'
      nextPageToken:
        type: string
  NatSpec:
    type: object
    properties:
      enabled:
        type: boolean
      masqueradeOutInterface:
        type: string
      enableUplinkForwarding:
        type: boolean
    description: NatSpec is SPEC-02 section 6.
  OperState:
    type: string
    enum:
      - OPER_STATE_UNSPECIFIED
      - OPER_STATE_UP
      - OPER_STATE_DOWN
      - OPER_STATE_ABSENT
    default: OPER_STATE_UNSPECIFIED
    description: |-
      OperState is the administrative state of a link. REQ-RES-019 derives it from
      the administrative flag, because a WireGuard link reports its operational
      state as unknown even while up.
  OverviewComponent:
    type: object
    properties:
      name:
        type: string
      result:
        $ref: '#/definitions/Result'
      message:
        type: string
      details:
        type: object
        additionalProperties:
          type: string
    description: |-
      OverviewComponent is REQ-DIA-052: one envelope for all nine components
      rather than thirty typed fields across nine messages, so a component can gain
      a detail without that being a change to the contract under REQ-API-061.
  Ownership:
    type: string
    enum:
      - OWNERSHIP_UNSPECIFIED
      - OWNERSHIP_MANAGED
      - OWNERSHIP_FOREIGN
      - OWNERSHIP_ORPHANED
    default: OWNERSHIP_UNSPECIFIED
    description: |-
      Ownership is REQ-RES-017. Every value is decided from desired state and the
      deletion record, both of which the store holds.
  Peer:
    type: object
    properties:
      interfaceName:
        type: string
      publicKey:
        type: string
      spec:
        $ref: '#/definitions/PeerSpec'
      status:
        $ref: '#/definitions/PeerStatus'
    description: |-
      Peer is the resource. REQ-RES-020 makes the pair (interface_name,
      public_key) its identity, and REQ-RES-034 keeps that out of the spec.

      public_key carries the encoding of REQ-RES-027 — standard base64 with
      padding. REQ-API-081 makes the REST gateway convert the unpadded base64url
      of a path segment into it.
  PeerSpec:
    type: object
    properties:
      presharedKey:
        type: string
        description: Write-only. REQ-RES-022 keeps it out of every response.
      allowedIps:
        type: array
        items:
          type: string
      endpoint:
        type: string
        description: Kernel-owned under REQ-RCN-013 and REQ-RCN-051. Adoption stores none.
      persistentKeepalive:
        type: integer
        format: int64
      labels:
        type: object
        additionalProperties:
          type: string
    description: PeerSpec is SPEC-01 section 4.2.
  PeerStatus:
    type: object
    properties:
      lastHandshakeAt:
        type: string
        format: date-time
      handshakeAgeSeconds:
        type: string
        format: uint64
      online:
        type: boolean
      rxBytes:
        type: string
        format: uint64
      txBytes:
        type: string
        format: uint64
      resolvedEndpoint:
        type: string
      protocolVersion:
        type: string
      revision:
        type: string
      condition:
        $ref: '#/definitions/Condition'
      warnings:
        type: array
        items:
          type: object
          $ref: '#/definitions/Warning'
    description: |-
      PeerStatus is SPEC-01 section 4.3.

      last_handshake_at and handshake_age_seconds use explicit presence because
      REQ-RES-023 requires null rather than an epoch-zero value when no handshake
      has occurred.
  ReconcileRequest:
    type: object
    properties:
      interfaceName:
        type: string
    description: |-
      REQ-RCN-020: an explicit Reconcile takes its scope from the request body, so
      one collection-level path covers the whole node and a single interface.
  ReconcileResponse:
    type: object
    properties:
      interfaces:
        type: array
        items:
          type: object
          $ref: '#/definitions/Interface'
  ReleaseInterfaceBody:
    type: object
  ReleaseInterfaceResponse:
    type: object
    properties:
      name:
        type: string
      peersRemoved:
        type: integer
        format: int64
      forwardingRestored:
        type: string
  Result:
    type: string
    enum:
      - RESULT_UNSPECIFIED
      - RESULT_PASS
      - RESULT_WARN
      - RESULT_FAIL
      - RESULT_UNKNOWN
    default: RESULT_UNSPECIFIED
    description: |-
      Result is the vocabulary of REQ-DIA-002, reused by REQ-DIA-021 and
      REQ-DIA-041 rather than duplicated.
  RotateInterfaceKeyBody:
    type: object
  RotateInterfaceKeyResponse:
    type: object
    properties:
      interface:
        $ref: '#/definitions/Interface'
      warning:
        type: string
    description: |-
      warning is the field REQ-KEY-004 requires: rotation disconnects every peer
      until each is updated with the new public key.
  Status:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/Any'
  UpdateInterfaceBody:
    type: object
    properties:
      spec:
        $ref: '#/definitions/InterfaceSpec'
      revision:
        type: string
    description: |-
      revision carries the optimistic-concurrency token of REQ-API-030. Omitting it
      overwrites unconditionally under REQ-API-032, which is why it has no presence
      marker: the empty string is the omission.
  UpdatePeerBody:
    type: object
    properties:
      spec:
        $ref: '#/definitions/PeerSpec'
      revision:
        type: string
  Warning:
    type: object
    properties:
      reason:
        type: string
      message:
        type: string
    description: |-
      Warning is one entry of REQ-RES-033: the reason code and message of one
      validation finding.
